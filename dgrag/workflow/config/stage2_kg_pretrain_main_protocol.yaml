# Frozen KG pretraining protocol paired with the successful QA run recorded in
# C:/Users/lieyi/Downloads/stage2_qa_finetune.log. The historical source is
# outputs/main_pretrain/.hydra/config.yaml; scripts may override only the
# hardware-equivalent local batch size and the intended ablation switches.

hydra:
  run:
    dir: outputs/main_pretrain/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - _self_
  - text_emb_model: mpnet

seed: 1024

datasets:
  _target_: dgrag.datasets.KGDataset
  cfgs:
    root: ./data
    force_rebuild: false
    text_emb_model_cfgs: ${text_emb_model}
    compute_structural_score: true
    structural_score_alpha: 0.2
  train_names: [hotpotqa_train_example]
  valid_names: []
  init_datasets: true
  feat_dim: 768
  max_datasets_in_memory: 10
  data_loading_workers: 4

model:
  _target_: dgrag.models.QueryGNN
  entity_model:
    _target_: dgrag.ultra.riemannian_models.RiemannianEntityNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: attention_frechet
    short_cut: true
    layer_norm: true
    branch_geometries: [lorentz, euclidean]
    use_alignment_loss: false
    alignment_weight: 0.01
    alignment_temperature: 0.2
    alignment_sample_size: 128
    use_decision_mutual_loss: true
    decision_mutual_weight: 0.01
    decision_mutual_temperature: 1.0
    decision_mutual_divergence: js
    use_topology_mutual_loss: true
    topology_mutual_weight: 0.005
    topology_mutual_temperature: 0.5
    topology_mutual_divergence: js
    topology_mutual_sample_size: 64
    topology_kernel_degree: 2
    topology_kernel_bias: 0.0
    topology_mask_self: true
    use_structure_gated_readout: false
    specialization_weight: 0.0
    specialization_margin: 0.1
    gate_tau_low: 0.1
    gate_tau_high: 0.75
    gate_beta: 0.1
    boundary_max_tangent_norm: 10.0
    message_max_tangent_norm: 10.0
    update_max_tangent_norm: 10.0
    use_edge_parallel: false
    edge_parallel_shard_strategy: contiguous
    euclidean_edge_weight_requires_grad: false

task:
  num_negative: 64
  strict_negative: true
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001

train:
  batch_size: 1
  distributed_batch_mode: ddp
  num_epoch: 10
  log_interval: 100
  fast_test: 5000
  save_best_only: false
  save_pretrained: true
  batch_per_epoch: 30000
  max_grad_norm: 1.0
  find_unused_parameters: false
  timeout: 60
  checkpoint: null
