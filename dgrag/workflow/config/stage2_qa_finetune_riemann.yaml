hydra:
  run:
    dir: outputs/qa_finetune_riemann/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - _self_
  - doc_ranker: idf_topk_ranker
  - text_emb_model: mpnet

seed: 1024

datasets:
  _target_: dgrag.datasets.QADataset
  cfgs:
    root: ./data
    force_rebuild: False
    text_emb_model_cfgs: ${text_emb_model}
    compute_structural_score: True
    structural_score_alpha: 0.2
  train_names:
    - musique_train0
  valid_names:
    - hotpotqa_test
    - musique_test
    - 2wikimultihopqa_test
  init_datasets: True
  feat_dim: 768
  max_datasets_in_memory: 10
  data_loading_workers: 4

model:
  _target_: dgrag.models.GNNRetriever
  use_question_entity_contrastive: yes
  question_entity_contrastive_weight: 0.1
  question_entity_contrastive_temperature: 0.2
  question_entity_contrastive_mode: hard
  question_entity_hard_negative_topk: 256
  question_entity_hard_negative_exclude_question_entities: true
  question_entity_hard_negative_random_fallback: true
  branch_supervised_weight: 0.03
  branch_supervised_bce_weight: 0.3
  branch_supervised_listce_weight: 0.7
  branch_supervised_adversarial_temperature: 0.2
  entity_model:
    _target_: dgrag.ultra.riemannian_models.RiemannianQueryNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: distmult
    aggregate_func: attention_frechet
    short_cut: yes
    layer_norm: yes
    branch_geometries: [lorentz, euclidean]
    use_alignment_loss: no
    alignment_weight: 0.01
    alignment_temperature: 0.2
    alignment_sample_size: 128
    use_decision_mutual_loss: yes
    decision_mutual_weight: 0.005
    decision_mutual_temperature: 1.0
    decision_mutual_divergence: js
    decision_mutual_teacher: fuse
    decision_mutual_branch_kl_weight: 0.2
    decision_mutual_candidate_mode: hard
    decision_mutual_topk: 256
    use_topology_mutual_loss: no
    topology_mutual_weight: 0.005
    topology_mutual_temperature: 0.5
    topology_mutual_divergence: js
    topology_mutual_sample_size: 64
    topology_kernel_degree: 2
    topology_kernel_bias: 0.0
    topology_mask_self: yes
    use_structure_gated_readout: no
    specialization_weight: 0.0
    specialization_margin: 0.1
    gate_tau_low: 0.1
    gate_tau_high: 0.75
    gate_beta: 0.1
    boundary_max_tangent_norm: 10.0
    message_max_tangent_norm: 10.0
    update_max_tangent_norm: 10.0
    use_edge_parallel: no
    edge_parallel_shard_strategy: contiguous
    euclidean_edge_weight_requires_grad: yes

task:
  strict_negative: yes
  metric:
    [mrr, hits@1, hits@2, hits@3, hits@5, hits@10, hits@20, hits@50, hits@100]
  absolute_doc_metric: [5, 10, 20]
  losses:
    - name: ent_bce_loss
      loss:
        _target_: dgrag.losses.BCELoss
        adversarial_temperature: 0.2
      cfg:
        weight: 0.3
        is_doc_loss: False
    - name: ent_pcr_loss
      loss:
        _target_: dgrag.losses.ListCELoss
      cfg:
        weight: 0.7
        is_doc_loss: False
    - name: doc_bce_loss
      loss:
        _target_: dgrag.losses.BCELoss
        adversarial_temperature: 0.2
      cfg:
        weight: 0.05
        is_doc_loss: True
    - name: doc_listce_loss
      loss:
        _target_: dgrag.losses.ListCELoss
      cfg:
        weight: 0.1
        is_doc_loss: True

optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-4

train:
  batch_size: 1
  distributed_batch_mode: ddp
  num_epoch: 25
  log_interval: 100
  batch_per_epoch: null
  save_best_only: yes
  save_pretrained: yes
  do_eval: yes
  max_grad_norm: 1.0
  find_unused_parameters: no
  timeout: 60
  init_entities_weight: True
  best_metric: doc_all_support_hit@5
  best_metric_dataset: null
  checkpoint: null
